# Хостовый nginx → контейнер калькулятора (127.0.0.1:61890).
# Ставится в /etc/nginx/sites-available/metal-v, сертификат — certbot certonly (DEPLOY.md).

# «Обновить цены» ходит на mc.ru, а частые запросы включают у них проверку «я не робот»
# и могут заблокировать адрес сервера. Одному клиенту — не чаще 3 раз в минуту.
limit_req_zone $binary_remote_addr zone=metal_refresh:1m rate=3r/m;

# ИИ-анализ стоит денег: новых задач (POST /api/ai/jobs) — не чаще 6 в минуту с одного IP.
# Сервер сверх этого держит 20 задач в час с адреса, очередь из 6 задач и 2 запроса к модели разом.
limit_req_zone $binary_remote_addr zone=metal_ai:1m rate=6r/m;

server {
    listen 80;
    server_name metal.vectra-agency.tech;
    # редирект внутри location, а не на уровне server: продление certbot (--nginx)
    # вставляет сюда location для /.well-known/acme-challenge/, и он должен сработать
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name metal.vectra-agency.tech;

    ssl_certificate /etc/letsencrypt/live/metal.vectra-agency.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metal.vectra-agency.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Node ничего не сжимает — сжимает nginx (бандл React и pdf.js, prices.json)
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:61890;
    }

    # имена файлов сборки содержат хэш — кэшируем навсегда
    location /assets/ {
        proxy_pass http://127.0.0.1:61890;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # обновление идёт по одному запросу к mc.ru с паузой — до 40 позиций, это минуты
    location = /api/prices/refresh {
        limit_req zone=metal_refresh burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:61890;
        proxy_read_timeout 300s;
    }

    # создание задачи ИИ-анализа (тело — данные заказа, до 900 КБ: client_max_body_size по умолчанию 1m).
    # Сам анализ идёт в фоне, браузер опрашивает GET /api/ai/jobs/<id> — эти запросы и загрузка
    # изображений (PUT …/images/<n>, до 900 КБ) идут через location / без ограничения частоты.
    location = /api/ai/jobs {
        limit_req zone=metal_ai burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @ai_429;
        proxy_pass http://127.0.0.1:61890;
    }

    # ответ nginx на 429 — JSON, как у сервера: браузер покажет текст ошибки
    location @ai_429 {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 429 '{"error":"Слишком частые запросы к ИИ-анализу — подождите минуту"}';
    }
}
